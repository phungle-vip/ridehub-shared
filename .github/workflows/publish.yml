name: Publish Maven Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: ridehub-releases
          server-username: ${{ secrets.REPOSILITE_USER || 'admin' }}
          server-password: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Set Maven version
        run: ./mvnw -B versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Build and Package
        run: ./mvnw -B clean package -DskipTests

      - name: Deploy to Reposilite
        run: ./mvnw -B deploy -DskipTests

