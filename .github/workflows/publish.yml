name: Publish Maven Package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: ridehub-releases
          server-username: ${{ secrets.REPOSILITE_USER || 'admin' }}
          server-password: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Configure Maven Snapshots Server Auth
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>ridehub-releases</id>
                <username>${{ secrets.REPOSILITE_USER || 'admin' }}</username>
                <password>${{ secrets.REPOSILITE_TOKEN }}</password>
              </server>
              <server>
                <id>ridehub-snapshots</id>
                <username>${{ secrets.REPOSILITE_USER || 'admin' }}</username>
                <password>${{ secrets.REPOSILITE_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing release version: $VERSION"

      - name: Set Maven release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mvnw -B versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Build and Package
        run: ./mvnw -B clean package -DskipTests

      - name: Deploy to Reposilite
        run: ./mvnw -B deploy -DskipTests

      - name: Trigger Webhook Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.DEPLOY_TOKEN || secrets.REPOSILITE_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "Sending deployment notification to VPS Webhook..."
            curl -fsS -X POST "https://webhook.phungvip.io.vn/hooks/deploy?service=all" \
              -H "X-Admin-Token: $DEPLOY_TOKEN" || echo "::warning::Webhook notification failed"
          else
            echo "DEPLOY_TOKEN secret not configured, skipping VPS webhook trigger."
          fi

